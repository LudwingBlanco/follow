name: lastfollows

on:
  schedule:
    - cron: "*/30 * * * *"   # comprobar follows cada 30 min (UTC). En GitHub free, no bajar de 30 min.
    - cron: "20 6 * * *"     # resumen diario por Telegram + panel web (UTC = 07:20 hora España)
  workflow_dispatch: {}      # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: lastfollows
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar follows y avisar
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          RUN_KIND: ${{ github.event.schedule }}
        run: python cloud.py

      - name: Guardar registro (historial.db)
        run: |
          git config user.name "lastfollows-bot"
          git config user.email "lastfollows@users.noreply.github.com"
          git add historial.db
          if git diff --cached --quiet; then
            echo "Sin cambios en el registro."
          else
            git commit -m "registro: $(date -u +'%Y-%m-%d %H:%M')"
            git push
          fi

  # Panel web en GitHub Pages. Solo se activa si creas la variable PAGES=1
  # (Settings → Secrets and variables → Actions → pestaña Variables) y el repo es público.
  dashboard:
    if: vars.PAGES == '1' && (github.event.schedule == '20 6 * * *' || github.event_name == 'workflow_dispatch')
    needs: vigilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar panel
        run: python dashboard.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar en Pages
        uses: actions/deploy-pages@v4
